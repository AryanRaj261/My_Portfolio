<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aryan Raj is a frontend developer building responsive, visually polished web experiences with React." />
    <meta name="theme-color" content="#050505" />
    <script>
      try {
        const savedTheme = localStorage.getItem("aryan-portfolio-theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f1f2ed" : "#05070a");
      } catch (_) {}
    </script>
    <meta name="author" content="Aryan Raj" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aryan Raj Portfolio" />
    <meta property="og:title" content="Aryan Raj | Frontend Developer" />
    <meta property="og:description" content="Explore selected frontend work, skills, and ways to get in touch with Aryan Raj." />
    <meta property="og:image:alt" content="A dark editorial landscape with a vermilion moon, from Aryan Raj's portfolio." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aryan Raj | Frontend Developer" />
    <meta name="twitter:description" content="Explore selected frontend work, skills, and ways to get in touch with Aryan Raj." />
    <!-- site-url -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- site-schema -->
    <title>Aryan Raj | Frontend Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
